services:
  proxy:
    build: .
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      UPSTREAM_URL: http://httpbin:8081
    ports:
      - "80:8080"
    networks:
      - edge
      - internal
    depends_on:
      - httpbin

  httpbin:
    image: ghcr.io/mccutchen/go-httpbin:2.25.0
    environment:
      PORT: "8081"
    networks:
      - internal

networks:
  edge:
  internal:
    internal: true
